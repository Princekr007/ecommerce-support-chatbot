trigger:
- main

variables:
  acrName: princechatbotregistry
  backendImage: backend
  frontendImage: frontend
  tag: $(Build.BuildId)

pool:
  vmImage: ubuntu-latest

steps:

# Login to Azure Container Registry
- script: |
    az acr login --name $(acrName)
  displayName: Login to ACR

# Build Backend Image
- script: |
    docker build -t $(acrName).azurecr.io/$(backendImage):$(tag) ./backend
  displayName: Build Backend Image

# Push Backend Image
- script: |
    docker push $(acrName).azurecr.io/$(backendImage):$(tag)
  displayName: Push Backend Image

# Build Frontend Image
- script: |
    docker build -t $(acrName).azurecr.io/$(frontendImage):$(tag) ./frontend
  displayName: Build Frontend Image

# Push Frontend Image
- script: |
    docker push $(acrName).azurecr.io/$(frontendImage):$(tag)
  displayName: Push Frontend Image